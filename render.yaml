services:
  - type: web
    name: tasklens-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements.txt && python download_nltk.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
